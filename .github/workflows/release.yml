# Gera o instalador e publica no GitHub Release quando uma tag v* é enviada.
# O app instalado lê o latest.yml desse Release para oferecer a atualização.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # O electron-builder envia os arquivos em paralelo e, sem um release existente, cada envio
      # cria o seu: saíam dois releases na mesma tag e o latest.yml ficava no que o GitHub não serve.
      - run: gh release create "$env:GITHUB_REF_NAME" --title "$($env:GITHUB_REF_NAME.TrimStart('v'))" --notes ""
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
